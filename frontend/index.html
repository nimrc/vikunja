<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Vikunja</title>
		<meta name="description" content="Vikunja - the to-do app to organize your life." />
		<link rel="icon" href="/favicon.ico" />
		<link rel="apple-touch-icon" href="/images/icons/apple-touch-icon-180x180.png" />
		<script>
			// Apply the theme before first paint to avoid a light flash in dark mode.
			try {
				var t = localStorage.getItem('theme')
				var dark = t === 'dark' || (t !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches)
				if (dark) document.documentElement.classList.add('dark')
			} catch (e) {}
		</script>
	</head>
	<body>
		<div id="app"></div>
		<script>
			// The Go server rewrites this to the public URL; empty means same origin.
			window.API_URL = ''
		</script>
		<script type="module" src="/src/main.tsx"></script>
	</body>
</html>
